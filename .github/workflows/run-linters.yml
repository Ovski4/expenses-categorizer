on: [push]

jobs:
  run-linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Build PHP container
        run: docker compose build php

      - name: Give writing permissions to the php container user
        run: sudo chown 1000:1000 -R .

      - name: Run composer install
        run: docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php composer install

      - name: Warm up the test cache
        # PHPStan reads var/cache/test/App_KernelTestDebugContainer.xml to resolve
        # services. The test container is used rather than the dev one because it
        # also holds the services declared in config/services_test.yaml, which the
        # analysed test suite relies on.
        run: >
          docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php
          php bin/console cache:warmup --env=test

      - name: Check code style
        run: docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php composer lint:style

      - name: Run static analysis
        run: docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php composer lint:stan

      - name: Lint YAML files
        run: docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php composer lint:yaml

      - name: Lint Twig templates
        run: docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php composer lint:twig

      - name: Lint the service container
        run: docker compose run --rm --no-deps -e RUN_MIGRATIONS=false php composer lint:container
